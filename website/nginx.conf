# Standalone nginx config for the RakeFlow simulator page.
# From the repository root:
#   start:  nginx -p "$PWD/website" -c nginx.conf
#   open:   http://localhost:8080
#   stop:   nginx -p "$PWD/website" -c nginx.conf -s stop
# (Windows: run the same commands from the nginx folder with -p pointing to the website folder.)
worker_processes 1;
pid nginx.pid;
error_log nginx-error.log;

events { worker_connections 64; }

http {
    types {
        text/html               html;
        text/css                css;
        application/javascript  js;
        image/svg+xml           svg;
    }
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path tmp;
    proxy_temp_path tmp;
    fastcgi_temp_path tmp;
    uwsgi_temp_path tmp;
    scgi_temp_path tmp;

    server {
        listen 8080;
        server_name localhost;
        root .;
        index index.html;
        location / { try_files $uri $uri/ =404; }
    }
}
